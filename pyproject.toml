[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainyourdragon"
version = "0.1.0"
description = "Train a small language model on your own writing, on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin James" }]
keywords = ["lora", "mlx", "fine-tuning", "writing", "local-llm", "apple-silicon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Training, fusing and serving. Apple silicon only.
mlx = ["mlx-lm>=0.31"]
# Publishing to, and pulling from, the Hugging Face Hub.
hub = ["huggingface_hub>=0.25"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/thejustinjames/TrainYourDragon"
Documentation = "https://github.com/thejustinjames/TrainYourDragon/tree/main/docs"
Issues = "https://github.com/thejustinjames/TrainYourDragon/issues"

[project.scripts]
dragon = "dragon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B905",  # zip(strict=) is 3.10+, and this supports 3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
